[build-system]
requires = ["setuptools>=77.0.0,<81.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "iints-sdk-python35" 
version = "1.5.18"
authors = [
  { name="Rune Bobbaers", email="rune.bobbaers@gmail.com" },
]
description = "A pre-clinical Edge-AI SDK for diabetes management validation."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE", "NOTICE", "LICENSE-MIT-IINTS-LEGACY"]
requires-python = ">=3.10,<3.15"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Operating System :: OS Independent",
    "Development Status :: 5 - Production/Stable",
]
dependencies = [
    "certifi>=2024.2.2",
    "cryptography>=41.0.0,<45.0.0",
    "fastapi>=0.115.0,!=0.136.3,<1.0.0",
    "numpy>=1.24.0,<3.0.0",
    "pandas>=2.0.0,<3.0.0",
    "pydantic>=2.0.0,<3.0.0",
    "PyYAML>=6.0.0,<7.0.0",
    "rich>=12.0.0,<16.0.0",
    "scipy>=1.9.0,<2.0.0",
    "typer>=0.9.0,<1.0.0",
    "uvicorn>=0.30.0,<1.0.0",
]

[project.optional-dependencies]
edge = [
  "pyserial>=3.5,<4.0",
]
reports = [
  "fpdf2>=2.8.0,<3.0.0",
  "matplotlib>=3.5.0,<4.0.0",
  "openpyxl>=3.0.0,<4.0.0",
  "pillow>=12.1.1,<13.0.0",
  "SciencePlots>=2.1.0,<3.0.0",
  "seaborn>=0.11.0,<1.0.0",
]
full = [
  "fpdf2>=2.8.0,<3.0.0",
  "matplotlib>=3.5.0,<4.0.0",
  "openpyxl>=3.0.0,<4.0.0",
  "pyserial>=3.5,<4.0",
  "pillow>=12.1.1,<13.0.0",
  "SciencePlots>=2.1.0,<3.0.0",
  "seaborn>=0.11.0,<1.0.0",
]
dev = [
  "pytest>=7.0.0,<10.0.0",
  "hypothesis>=6.0.0,<7.0.0",
  "flake8>=7.0.0,<8.0.0",
  "httpx>=0.27.0,<1.0.0",
  "mypy>=1.8.0,<3.0.0",
  "pandas-stubs>=2.0.0,<3.0.0",
  "types-PyYAML>=6.0.0,<7.0.0",
  "types-psutil>=7.0.0,<8.0.0",
]
torch = [
  "torch>=1.9.0,<3.0.0",
]
nightscout = [
  "py-nightscout",
]
research = [
  "torch>=2.0.0,<3.0.0",
  "pyarrow>=12.0.0,<25.0.0",
  "h5py>=3.10.0,<4.0.0",
  "onnx>=1.16.0,<2.0.0",
  "onnxscript>=0.1.0,<1.0.0",
  "plotly>=5.18.0,<7.0.0",
]
mdmp = [
  "cryptography>=42.0.0,<50.0.0",
]
desktop = [
  "pyinstaller>=6.11.0,<7.0.0",
  "setuptools>=77.0.0,<81.0.0",
]
desktop-qt = [
  "pyinstaller>=6.11.0,<7.0.0",
  "setuptools>=77.0.0,<81.0.0",
  "PySide6>=6.7.0,<7.0.0",
  "plotly>=5.18.0,<7.0.0",
]
desktop-macos = [
  "pyinstaller>=6.11.0,<7.0.0",
  "setuptools>=77.0.0,<81.0.0",
  "pyobjc-framework-Cocoa>=10.0,<13.0",
]

[project.scripts]
iints = "iints.cli.cli:app"
iints-desktop = "iints_desktop.launcher:main"
iints-desktop-tk = "iints_desktop.app:main"
iints-desktop-qt = "iints_desktop.qt_app:main"
iints-desktop-cocoa = "iints_desktop.cocoa_app:main"
iints-sdk-doctor = "iints_sdk_python35_doctor:main"

[project.entry-points."iints.algorithms"]
"PID Controller" = "iints.core.algorithms.pid_controller:PIDController"
"Fixed Basal Bolus" = "iints.core.algorithms.fixed_basal_bolus:FixedBasalBolus"
"Correction Bolus" = "iints.core.algorithms.correction_bolus:CorrectionBolus"
"Standard Pump" = "iints.core.algorithms.standard_pump_algo:StandardPumpAlgorithm"
"Mock Constant Dose" = "iints.core.algorithms.mock_algorithms:ConstantDoseAlgorithm"
"Mock Random Dose" = "iints.core.algorithms.mock_algorithms:RandomDoseAlgorithm"

[project.urls]
"Homepage" = "https://github.com/python35/IINTS-SDK"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
iints_desktop = [
  "assets/alphafold/*.png",
  "assets/alphafold/*.cif",
]
iints = [
  "templates/*.py",
  "templates/scenarios/*.json",
  "templates/uno_q/*.ino",
  "templates/uno_q/*.md",
  "templates/pico_pump/*.py",
  "templates/pico_pump/*.md",
  "templates/pico_pump/*.txt",
  "assets/*.png",
  "data/*.json",
  "data/contracts/*.yaml",
  "data/virtual_patients/*.yaml",
  "data/demo/*.csv",
  "presets/*.json",
  "presets/*.yaml",
]
mdmp_core = [
  "keys/*.pem",
  "data/conformance/vectors/*.json",
]

[tool.coverage.run]
omit = [
  "src/iints/templates/default_algorithm.py",
]
