site_name: IINTS-AF SDK Documentation
site_description: Safety-first simulation SDK for insulin algorithm research.
site_url: https://python35.github.io/IINTS-SDK/
repo_url: https://github.com/python35/IINTS-SDK
repo_name: python35/IINTS-SDK
edit_uri: edit/main/docs/

theme:
  name: material
  custom_dir: docs/overrides
  language: en
  logo: assets/iints-mark.png
  favicon: assets/iints-mark.png
  palette:
    - scheme: default
      primary: white
      accent: teal
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.instant
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

extra_javascript:
  - javascripts/force-light.js
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

extra_css:
  - stylesheets/extra.css
  - stylesheets/force-light.css

