site_name: IINTS-AF SDK Documentation
site_description: Safety-first simulation SDK for insulin algorithm research.
site_url: https://python35.github.io/IINTS-SDK/
repo_url: https://github.com/python35/IINTS-SDK
repo_name: python35/IINTS-SDK
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  logo: assets/iints-logo.png
  favicon: assets/iints-logo.png
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
    - search.highlight

markdown_extensions:
  - admonition
  - codehilite
  - footnotes
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

extra_javascript:
  - https://unpkg.com/mermaid@11/dist/mermaid.min.js
  - javascripts/mermaid.js

extra_css:
  - stylesheets/extra.css

nav:
  - Home: index.md
  - Start Here:
      - Overview In Plain Language: PLAIN_LANGUAGE_GUIDE.md
      - 5-Minute Quickstart: QUICKSTART.md
      - Getting Started: GETTING_STARTED.md
      - Installation: INSTALLATION.md
      - Troubleshooting: TROUBLESHOOTING.md
      - Updating An Existing Install: UPDATING.md
  - User Guides:
      - AI Assistant: AI_ASSISTANT.md
      - Study Analysis: STUDY_ANALYSIS.md
      - Scientific Workflow: SCIENTIFIC_WORKFLOW.md
      - Booth Demo & Presentation Flow: BOOTH_DEMO.md
  - Edge & Deployment:
      - Edge Hardware & SBC Matrix: EDGE_HARDWARE.md
      - Raspberry Pi Digital Patient: DIGITAL_PATIENT_PI.md
      - Remote Deploy & Pi Connect: EDGE_REMOTE_DEPLOY.md
      - Maker Faire Pi Mode: MAKERFAIRE_PI.md
      - Maker Faire Pi Checklist: MAKERFAIRE_PI_CHECKLIST.md
      - Arduino UNO Q Setup: ARDUINO_UNO_Q.md
  - Data Quality (MDMP):
      - MDMP Quickstart: MDMP_QUICKSTART.md
      - MDMP Guide: MDMP_FULL_GUIDE.md
      - MDMP Specification (Draft): MDMP.md
  - Reference:
      - Command Reference: COMMAND_REFERENCE.md
      - CLI & Advanced Reference: TECHNICAL_README.md
      - Architecture & Module Guide: COMPREHENSIVE_GUIDE.md
      - Emulation Notes: emulation_references.md
      - Evidence Base: EVIDENCE_BASE.md
      - Documentation By Role: DOCUMENTATION_INDEX.md
      - Manual Overview: OFFICIAL_MANUAL.md
