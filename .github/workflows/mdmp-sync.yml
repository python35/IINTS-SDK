name: MDMP Sync Gate

on:
  push:
    branches: [ main ]
    paths:
      - "src/iints/mdmp/**"
      - "src/iints/cli/cli.py"
      - "tools/ci/check_mdmp_sync.py"
      - ".github/workflows/mdmp-sync.yml"
      - "pyproject.toml"
  pull_request:
    branches: [ main ]
    paths:
      - "src/iints/mdmp/**"
      - "src/iints/cli/cli.py"
      - "tools/ci/check_mdmp_sync.py"
      - ".github/workflows/mdmp-sync.yml"
      - "pyproject.toml"
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

jobs:
  mdmp-sync:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python 3.11
      uses: actions/setup-python@v6
      with:
        python-version: "3.11"

    - name: Install SDK
      run: |
        python -m pip install --upgrade pip
        pip install -e .

    - name: Resolve MDMP source
      id: mdmp_source
      env:
        MDMP_REPO_TOKEN: ${{ secrets.MDMP_REPO_TOKEN }}
      run: |
        if [ -n "${MDMP_REPO_TOKEN}" ]; then
          echo "mode=repo" >> $GITHUB_OUTPUT
          echo "MDMP source mode: repository checkout"
        else
          echo "mode=pypi" >> $GITHUB_OUTPUT
          echo "MDMP source mode: PyPI package fallback"
        fi

    - name: Checkout standalone MDMP repo
      if: steps.mdmp_source.outputs.mode == 'repo'
      uses: actions/checkout@v4
      with:
        repository: python35/MDMP
        ref: main
        path: external/mdmp
        token: ${{ secrets.MDMP_REPO_TOKEN }}

    - name: Install standalone MDMP package (repo)
      if: steps.mdmp_source.outputs.mode == 'repo'
      run: |
        pip install -e external/mdmp

    - name: Install standalone MDMP package (PyPI fallback)
      if: steps.mdmp_source.outputs.mode == 'pypi'
      run: |
        pip install "mdmp-protocol>=0.3.1"

    - name: Run MDMP sync check
      env:
        IINTS_MDMP_BACKEND: mdmp_core
      run: |
        python tools/ci/check_mdmp_sync.py
