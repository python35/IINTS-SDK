name: MDMP Sync Gate

on:
  push:
    branches: [ main ]
    paths:
      - "src/iints/mdmp/**"
      - "src/iints/live_patient/**"
      - "src/iints/__init__.py"
      - "src/iints/cli/cli.py"
      - "tools/ci/check_mdmp_sync.py"
      - ".github/workflows/mdmp-sync.yml"
      - "pyproject.toml"
  pull_request:
    branches: [ main ]
    paths:
      - "src/iints/mdmp/**"
      - "src/iints/live_patient/**"
      - "src/iints/__init__.py"
      - "src/iints/cli/cli.py"
      - "tools/ci/check_mdmp_sync.py"
      - ".github/workflows/mdmp-sync.yml"
      - "pyproject.toml"
  workflow_dispatch:
  schedule:
    - cron: "15 3 * * *"

jobs:
  mdmp-sync:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v7

    - name: Set up Python 3.11
      uses: actions/setup-python@v5
      with:
        python-version: "3.11"

    - name: Install SDK with bundled MDMP support
      run: |
        python -m pip install --upgrade pip
        pip install -e ".[mdmp]"
        pip install httpx

    - name: Run MDMP sync check
      env:
        IINTS_MDMP_BACKEND: mdmp_core
      run: |
        python tools/ci/check_mdmp_sync.py
