name: Notebook Bake

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  bake:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
          python -m pip install nbconvert nbformat ipykernel

      - name: Register Python kernel
        run: |
          python -m ipykernel install --user --name python3 --display-name "Python 3"

      - name: Normalize notebook metadata
        run: |
          python - <<'PY'
          import nbformat
          from pathlib import Path
          
          for path in Path("examples/notebooks").glob("*.ipynb"):
              nb = nbformat.read(path, as_version=4)
              nbformat.validate(nb)
              nbformat.write(nb, path)
          PY

      - name: Execute notebooks
        env:
          MPLCONFIGDIR: /tmp
        run: |
          jupyter nbconvert --execute --to notebook --inplace \
            --ExecutePreprocessor.kernel_name=python3 \
            --ExecutePreprocessor.timeout=600 \
            examples/notebooks/*.ipynb

      - name: Clean generated artifacts
        run: |
          rm -rf results

      - name: Check notebook drift
        run: |
          if [ -n "$(git status --porcelain examples/notebooks)" ]; then
            echo "Notebook outputs changed during bake. Run the bake locally and commit intentionally."
            git status --short examples/notebooks
            exit 1
          fi
          echo "No notebook drift detected."
