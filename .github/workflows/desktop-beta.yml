name: Desktop Beta Builds

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "GitHub prerelease tag to create/update"
        required: true
        default: "desktop-beta-latest"
      draft:
        description: "Create the GitHub release as a draft"
        type: boolean
        required: true
        default: true
      upload_release:
        description: "Upload build artifacts to a GitHub prerelease"
        type: boolean
        required: true
        default: true
  push:
    tags:
      - "desktop-beta*"

permissions:
  contents: write

concurrency:
  group: desktop-beta-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  APP_NAME: "IINTS-AF-Desktop-Beta"

jobs:
  build:
    name: Build ${{ matrix.platform_label }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: windows-latest
            platform_label: windows-x64
          - runner: macos-latest
            platform_label: macos
          - runner: ubuntu-latest
            platform_label: linux-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install Linux Qt runtime libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libopengl0 libxcb-cursor0

      - name: Install desktop dependencies
        shell: bash
        run: |
          python -m pip install --upgrade pip wheel
          python -m pip install "setuptools>=83,<84" pytest
          python -m pip install -U -e ".[desktop-all]"

      - name: Verify bundled research runtimes
        shell: bash
        run: |
          python -c "import PySide6, fmpy, plotly, roadrunner; print('desktop-all runtimes OK')"

      - name: Make FMPy libraries relocatable on macOS
        if: runner.os == 'macOS'
        run: |
          python tools/desktop/repair_fmpy_macos_dylibs.py

      - name: Run desktop unit tests
        run: |
          python -m pytest tests/test_desktop_app.py -q

      - name: Build desktop bundle
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "macOS" ]]; then
            python tools/desktop/build_qt_desktop_app.py --backend qt --onedir --name "${APP_NAME}"
          else
            python tools/desktop/build_qt_desktop_app.py --backend qt --name "${APP_NAME}"
          fi

      - name: Smoke test bundled app on Linux
        if: runner.os == 'Linux'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          exe="dist/${APP_NAME}"
          echo "Smoke testing: $exe"
          "$exe" --smoke-full

      - name: Smoke test bundled app on macOS
        if: runner.os == 'macOS'
        shell: bash
        run: |
          set -euo pipefail
          exe="dist/${APP_NAME}.app/Contents/MacOS/${APP_NAME}"
          echo "Smoke testing macOS app: $exe"
          set +e
          "$exe" --smoke-full 2>&1 | tee macos-smoke.log
          status=${PIPESTATUS[0]}
          set -e
          if [[ "$status" -ne 0 ]]; then
            echo "::error::macOS desktop smoke failed with exit code $status"
            echo "---- macOS smoke output ----"
            cat macos-smoke.log || true
            echo "---- app bundle files ----"
            find "dist/${APP_NAME}.app" -maxdepth 4 -type f | sort | sed -n '1,240p' || true
            echo "---- executable dependencies ----"
            otool -L "$exe" || true
            echo "---- IINTS desktop startup log ----"
            cat "$HOME/Library/Logs/IINTS-AF Desktop/desktop.log" || true
            exit "$status"
          fi

      - name: Smoke test bundled app on Windows
        if: runner.os == 'Windows'
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          set -euo pipefail
          exe="dist/${APP_NAME}.exe"
          echo "Best-effort smoke testing Windows app: $exe"
          "$exe" --smoke-full

      - name: Sign Windows executable when certificate secrets exist
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          WINDOWS_SIGNING_PFX_BASE64: ${{ secrets.WINDOWS_SIGNING_PFX_BASE64 }}
          WINDOWS_SIGNING_PFX_PASSWORD: ${{ secrets.WINDOWS_SIGNING_PFX_PASSWORD }}
        run: |
          if (-not $env:WINDOWS_SIGNING_PFX_BASE64) {
            Write-Host "Skipping Windows signing: WINDOWS_SIGNING_PFX_BASE64 is not configured."
            exit 0
          }
          if (-not $env:WINDOWS_SIGNING_PFX_PASSWORD) {
            throw "WINDOWS_SIGNING_PFX_PASSWORD is required when WINDOWS_SIGNING_PFX_BASE64 is configured."
          }

          $exe = "dist/${env:APP_NAME}.exe"
          if (-not (Test-Path $exe)) {
            throw "Windows executable not found: $exe"
          }

          $pfxPath = Join-Path $env:RUNNER_TEMP "iints-windows-codesign.pfx"
          [IO.File]::WriteAllBytes($pfxPath, [Convert]::FromBase64String($env:WINDOWS_SIGNING_PFX_BASE64))

          $kitsRoot = Join-Path ${env:ProgramFiles(x86)} "Windows Kits\10\bin"
          $signtool = Get-ChildItem $kitsRoot -Recurse -Filter signtool.exe |
            Where-Object { $_.FullName -match '\\x64\\signtool.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if (-not $signtool) {
            throw "signtool.exe not found. Install the Windows SDK on the runner."
          }

          & $signtool.FullName sign /f $pfxPath /p $env:WINDOWS_SIGNING_PFX_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 /d "IINTS-AF Desktop Beta" $exe
          & $signtool.FullName verify /pa /v $exe
          Remove-Item $pfxPath -Force

      - name: Sign macOS app when Developer ID secrets exist
        if: runner.os == 'macOS'
        shell: bash
        env:
          MACOS_CERTIFICATE_P12_BASE64: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          MACOS_KEYCHAIN_PASSWORD: ${{ secrets.MACOS_KEYCHAIN_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          if [[ -z "$MACOS_CERTIFICATE_P12_BASE64" ]]; then
            echo "Skipping macOS signing: MACOS_CERTIFICATE_P12_BASE64 is not configured."
            exit 0
          fi
          if [[ -z "$MACOS_CERTIFICATE_PASSWORD" || -z "$MACOS_KEYCHAIN_PASSWORD" || -z "$MACOS_SIGNING_IDENTITY" ]]; then
            echo "MACOS_CERTIFICATE_PASSWORD, MACOS_KEYCHAIN_PASSWORD, and MACOS_SIGNING_IDENTITY are required when macOS signing is enabled."
            exit 1
          fi

          app_path="dist/${APP_NAME}.app"
          if [[ ! -d "$app_path" ]]; then
            echo "macOS .app bundle not found: $app_path"
            exit 1
          fi

          keychain_path="$RUNNER_TEMP/iints-signing.keychain-db"
          certificate_path="$RUNNER_TEMP/developer-id-application.p12"
          echo "$MACOS_CERTIFICATE_P12_BASE64" | base64 --decode > "$certificate_path"

          security create-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"
          security import "$certificate_path" -P "$MACOS_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$keychain_path"
          security list-keychains -d user -s "$keychain_path" $(security list-keychains -d user | sed 's/"//g')
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$MACOS_KEYCHAIN_PASSWORD" "$keychain_path"

          codesign --deep --force --options runtime --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$app_path"
          codesign --verify --deep --strict --verbose=2 "$app_path"

      - name: Package release asset
        shell: bash
        run: |
          set -euo pipefail
          python tools/desktop/package_desktop_bundle.py \
            --dist-dir dist \
            --app-name "${APP_NAME}" \
            --platform-label "${{ matrix.platform_label }}" \
            --output-dir desktop-dist

      - name: Notarize macOS DMG when Apple notary secrets exist
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          MACOS_SIGNING_IDENTITY: ${{ secrets.MACOS_SIGNING_IDENTITY }}
        run: |
          set -euo pipefail
          dmg_path="desktop-dist/${APP_NAME}-${{ matrix.platform_label }}.dmg"
          if [[ -z "$APPLE_ID" || -z "$APPLE_TEAM_ID" || -z "$APPLE_APP_SPECIFIC_PASSWORD" ]]; then
            echo "Skipping notarization: APPLE_ID, APPLE_TEAM_ID, or APPLE_APP_SPECIFIC_PASSWORD is not configured."
            exit 0
          fi
          if [[ ! -f "$dmg_path" ]]; then
            echo "DMG not found: $dmg_path"
            exit 1
          fi
          if [[ -n "$MACOS_SIGNING_IDENTITY" ]]; then
            codesign --force --timestamp --sign "$MACOS_SIGNING_IDENTITY" "$dmg_path"
          fi
          xcrun notarytool submit "$dmg_path" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_SPECIFIC_PASSWORD" --wait
          xcrun stapler staple "$dmg_path"
          xcrun stapler validate "$dmg_path"
          checksum="$(shasum -a 256 "$dmg_path" | awk '{print $1}')"
          printf "%s  %s\n" "$checksum" "$(basename "$dmg_path")" > "${dmg_path}.sha256"

      - name: Write debug summary
        if: always()
        shell: bash
        run: |
          mkdir -p desktop-debug
          {
            echo "runner=$RUNNER_OS"
            python --version
            python -m pip --version
            echo
            echo "installed packages:"
            python -m pip freeze | sort
            echo
            echo "dist files:"
            find dist -maxdepth 3 -type f -print 2>/dev/null | sort || true
            echo
            echo "desktop-dist files:"
            find desktop-dist -maxdepth 2 -type f -print 2>/dev/null | sort || true
            echo
            echo "macos smoke log:"
            cat macos-smoke.log 2>/dev/null || true
          } > "desktop-debug/desktop-build-debug-${{ matrix.platform_label }}.txt"

      - name: Upload desktop artifact
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.platform_label }}
          path: desktop-dist/*
          if-no-files-found: error

      - name: Upload desktop debug artifact
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-debug-${{ matrix.platform_label }}
          path: desktop-debug/*
          if-no-files-found: ignore

  release:
    name: Publish desktop prerelease
    needs: build
    runs-on: ubuntu-latest
    if: ${{ startsWith(github.ref, 'refs/tags/desktop-beta') || (github.event_name == 'workflow_dispatch' && inputs.upload_release) }}
    steps:
      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          path: release-assets
          merge-multiple: true

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            echo "tag=${{ inputs.release_tag }}" >> "$GITHUB_OUTPUT"
            echo "draft=${{ inputs.draft }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
            echo "draft=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Write release notes
        shell: bash
        run: |
          cat > desktop-beta-release-notes.md <<'EOF'
          # IINTS-AF Desktop Beta

          This prerelease contains experimental native desktop builds for the IINTS-AF SDK research workbench.

          ## Downloads

          - `IINTS-AF-Desktop-Beta-windows-x64.exe` is the Windows executable.
          - `IINTS-AF-Desktop-Beta-macos.dmg` is the macOS disk image containing the app.
          - `IINTS-AF-Desktop-Beta-linux-x64` is the Linux executable.

          Builds are signed/notarized automatically when the repository signing secrets are configured.

          ## Scope

          The desktop app is a native Qt workbench around the SDK engine on Windows, macOS, and Linux. The packaged builds include the Python/Qt runtime, reports, MDMP support, research plotting, serial/edge support, libRoadRunner, and FMPy. Users do not install those Python components separately. The macOS build also verifies that bundled FMPy/SUNDIALS libraries use relocatable app-bundle paths.

          COPASI, OpenCOR, and Ollama are external system applications. Their audited connectors and readiness checks are included, but the external binaries and AI model files are not silently installed. The app detects them and explains the remaining setup when a workflow needs one.

          ## Safety

          Research and education only. This is not a medical device and must not be used for diagnosis, insulin dosing, treatment decisions, or real-time patient care.
          EOF

      - name: Create or update GitHub prerelease
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          name: IINTS-AF Desktop Beta (${{ steps.release.outputs.tag }})
          body_path: desktop-beta-release-notes.md
          files: release-assets/*
          overwrite_files: true
          draft: ${{ steps.release.outputs.draft }}
          prerelease: true
          make_latest: false
