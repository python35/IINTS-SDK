name: Health Badges

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  badges:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e .
          python -m pip install -r requirements-dev.txt
          python -m pip install pytest pytest-cov coverage genbadge interrogate anybadge

      - name: Run tests with coverage
        run: |
          python -m pytest --cov=src/iints --cov-report=xml

      - name: Generate coverage badge
        run: |
          mkdir -p badges
          genbadge coverage -i coverage.xml -o badges/coverage.svg

      - name: Generate docs coverage badge
        run: |
          python - <<'PY'
          import re
          import subprocess
          import sys
          from pathlib import Path
          
          result = subprocess.run(
              ["interrogate", "-q", "-r", "src/iints", "--fail-under", "0"],
              capture_output=True,
              text=True,
              check=False,
          )
          output = result.stdout + result.stderr
          match = re.search(r"(\\d+\\.?\\d*)%", output)
          percent = float(match.group(1)) if match else 0.0
          Path("badges").mkdir(exist_ok=True)
          subprocess.check_call(
              [
                  sys.executable,
                  "-m",
                  "anybadge",
                  "--label",
                  "docs",
                  "--value",
                  f"{percent:.1f}",
                  "--suffix",
                  "%",
                  "--overwrite",
                  "--file",
                  "badges/docs.svg",
              ]
          )
          print(output)
          PY

      - name: Upload badge artifacts
        uses: actions/upload-artifact@v4
        with:
          name: health-badges
          path: badges/*.svg
