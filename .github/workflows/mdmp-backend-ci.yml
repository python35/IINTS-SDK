name: MDMP Backend Compatibility

on:
  push:
    branches: [ main ]
    paths:
      - "src/iints/mdmp/**"
      - "pyproject.toml"
      - ".github/workflows/mdmp-backend-ci.yml"
  pull_request:
    branches: [ main ]
    paths:
      - "src/iints/mdmp/**"
      - "pyproject.toml"
      - ".github/workflows/mdmp-backend-ci.yml"

jobs:
  test-without-mdmp:
    name: SDK zonder MDMP
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK without MDMP extra
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest mypy httpx

      - name: Run smoke checks
        run: |
          pytest tests/ -q

  test-with-mdmp:
    name: SDK met MDMP backend
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SDK with MDMP extra
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[mdmp]"
          pip install pytest mypy httpx

      - name: Run smoke checks (MDMP backend)
        env:
          IINTS_MDMP_BACKEND: mdmp_core
        run: |
          pytest tests/ -q
